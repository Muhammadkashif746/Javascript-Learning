<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <div class="output-box">
            <input type="text" id="password" readonly placeholder="Click Generate">
            <button id="copyBtn" title="Copy">📋</button>
        </div>

        <div class="settings">
            <div class="setting">
                <label for="length">Password Length: <span id="lengthValue">12</span></label>
                <input type="range" id="length" min="6" max="30" value="12">
            </div>

            <div class="setting checkbox">
                <label>
                    <input type="checkbox" id="uppercase" checked>
                    Include Uppercase (A-Z)
                </label>
            </div>

            <div class="setting checkbox">
                <label>
                    <input type="checkbox" id="lowercase" checked>
                    Include Lowercase (a-z)
                </label>
            </div>

            <div class="setting checkbox">
                <label>
                    <input type="checkbox" id="numbers" checked>
                    Include Numbers (0-9)
                </label>
            </div>

            <div class="setting checkbox">
                <label>
                    <input type="checkbox" id="symbols" checked>
                    Include Symbols (!@#$...)
                </label>
            </div>
        </div>

        <button id="generateBtn" class="generate">Generate Password</button>
        <p id="message" class="message"></p>

        <a href="../index.html" class="back">← Back to Projects</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
