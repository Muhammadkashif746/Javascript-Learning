<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 - Advanced Form Events</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>04. Advanced Form Events</h1>
        <a href="../index.html">← Back</a>
    </header>

    <section>
        <h2>Real-time Form Validation + Live Preview</h2>

        <div class="demo-grid">
            <!-- Registration Form -->
            <div class="card">
                <h3>Registration Form</h3>
                <form id="regForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Your name" required>
                        <small id="nameError" style="color:#f87171; display:none;">Name must be at least 3 characters</small>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                        <small id="emailError" style="color:#f87171; display:none;">Enter a valid email</small>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Min 6 characters" required>
                        <small id="passError" style="color:#f87171; display:none;">Password too short</small>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirm" placeholder="Confirm password" required>
                        <small id="confirmError" style="color:#f87171; display:none;">Passwords do not match</small>
                    </div>
                    <button type="submit" class="success" style="width:100%;">Register</button>
                </form>
            </div>

            <!-- Live Preview Card -->
            <div class="card">
                <h3>Live Preview</h3>
                <div class="live-area" style="text-align:left; padding:20px;">
                    <p><strong>Name:</strong> <span id="prevName">—</span></p>
                    <p><strong>Email:</strong> <span id="prevEmail">—</span></p>
                    <p><strong>Password Strength:</strong> <span id="prevStrength">—</span></p>
                </div>
                <pre id="output" style="min-height:120px; margin-top:15px;">Form events will appear here...</pre>
            </div>
        </div>
    </section>

    <script src="forms-events.js"></script>
</body>
</html>
